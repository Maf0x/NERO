<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>NERO Audio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0a0a0c;
      --card-hover: #121216;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-sub: #71717a;
      --accent: #ffffff;
      --accent-text: #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 16px 10px; }
    
    .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
    .brand h1 { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
    .brand p { font-size: 10px; color: var(--text-sub); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-icon:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.2); }

    .tabs { display: flex; background: var(--card); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
    .tab { flex: 1; background: transparent; border: 0; color: var(--text-sub); padding: 7px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .tab.active { background: #27272a; color: var(--text); }

    .dropzone { border: 1.5px dashed var(--border); border-radius: 16px; padding: 14px; text-align: center; background: var(--card); transition: all 0.2s; }
    .dropzone:hover { border-color: rgba(255,255,255,0.25); background: var(--card-hover); }
    input[type=file] { display: none; }
    .btn-upload { display: inline-block; background: var(--accent); color: var(--accent-text); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 12px; cursor: pointer; transition: transform 0.1s; }
    .btn-upload:active { transform: scale(0.95); }
    .dropzone p { color: var(--text-sub); font-size: 10px; margin-top: 6px; }

    .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 14px; }
    
    .cover-box { width: 100%; aspect-ratio: 1; max-width: 170px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.5); position: relative; border: 1px solid var(--border); }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cover-placeholder { font-size: 36px; color: #27272a; }

    .track-meta { text-align: center; padding: 0 2px; }
    .track-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .track-artist { font-size: 11px; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

    .progress-area { display: flex; flex-direction: column; gap: 4px; }
    .progress-slider { width: 100%; height: 4px; background: #27272a; border-radius: 2px; appearance: none; outline: none; cursor: pointer; accent-color: var(--accent); }
    .time-info { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-sub); font-variant-numeric: tabular-nums; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
    .ctrl-btn { background: transparent; border: 0; color: var(--text); font-size: 16px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.8; transition: all 0.15s; flex-shrink: 0; }
    .ctrl-btn:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn.main { width: 48px; height: 48px; background: var(--accent); color: var(--accent-text); font-size: 15px; opacity: 1; box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
    .ctrl-btn.main:hover { background: #e4e4e7; }

    .sub-controls { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
    .volume-box { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-sub); }
    .volume-box input { accent-color: var(--accent); width: 70px; cursor: pointer; height: 3px; }
    .btn-danger { background: transparent; border: 0; color: #ef4444; font-size: 10px; font-weight: 600; cursor: pointer; padding: 3px 6px; border-radius: 4px; transition: background 0.15s; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

    .view-section { display: none; flex-direction: column; gap: 8px; }
    .view-section.active { display: flex; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
    .section-header h2 { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: var(--text-sub); text-transform: uppercase; }

    .scroll-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; }
    .scroll-list::-webkit-scrollbar { width: 3px; }
    .scroll-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }

    .track-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 10px; background: var(--card); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; }
    .track-item:hover { background: var(--card-hover); }
    .track-item.active { background: var(--card-hover); border-color: var(--border); }
    .track-num { font-size: 10px; color: var(--text-sub); width: 14px; text-align: center; font-weight: 600; }
    .track-details { flex: 1; min-width: 0; }
    .track-details b { display: block; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-details span { font-size: 9px; color: var(--text-sub); }
    .track-actions-item { display: flex; gap: 2px; }
    .mini-btn { background: transparent; border: 0; color: var(--text-sub); width: 20px; height: 20px; border-radius: 4px; font-size: 9px; display: grid; place-items: center; cursor: pointer; transition: all 0.15s; }
    .mini-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .mini-btn.del:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

    .albums-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 2px; }
    .albums-grid::-webkit-scrollbar { width: 3px; }
    .albums-grid::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    .album-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 7px; display: flex; flex-direction: column; justify-content: space-between; }
    .album-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #000; display: grid; place-items: center; overflow: hidden; font-size: 22px; color: #27272a; margin-bottom: 5px; cursor: pointer; border: 1px solid var(--border); }
    .album-cover img { width: 100%; height: 100%; object-fit: cover; }
    .album-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-artist { font-size: 9px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .album-btns { display: flex; gap: 3px; }
    .album-btn-play { flex: 1; background: var(--text); color: var(--bg); border: 0; border-radius: 5px; padding: 4px; font-size: 9px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .album-btn-play:active { transform: scale(0.95); }
    .album-btn-del { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 5px; padding: 4px 5px; font-size: 9px; cursor: pointer; }

    .empty-state { color: var(--text-sub); text-align: center; padding: 16px; font-size: 11px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<main class="app">
  <header class="header">
    <div class="brand">
      <h1 id="i-title">NERO</h1>
      <p id="i-sub">Engine</p>
    </div>
    <div class="header-actions">
      <button id="saveBackup" class="btn-icon" title="Backup">💾 Backup</button>
      <select id="langSelect" class="btn-icon" style="padding: 5px 6px;">
        <option value="es">ES</option>
        <option value="pt">PT</option>
        <option value="en">EN</option>
      </select>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tab-queue" data-target="queue-view">Cola</button>
    <button class="tab" id="tab-albums" data-target="albums-view">Álbumes</button>
  </nav>

  <div class="dropzone">
    <label id="i-pick" class="btn-upload" for="files">＋ Añadir Música</label>
    <input id="files" type="file" accept="audio/mp3, audio/*" multiple>
    <p id="i-droptext">Almacenamiento seguro interno</p>
  </div>

  <section class="player-card">
    <div class="cover-box">
      <div id="cover-placeholder" class="cover-placeholder">♫</div>
      <img id="cover-img" alt="Cover">
    </div>
    
    <div class="track-meta">
      <div id="title" class="track-title">Sin reproducción</div>
      <div id="artist" class="track-artist">NERO</div>
    </div>
    
    <div class="progress-area">
      <input type="range" id="progress" class="progress-slider" value="0" min="0" max="100" step="0.1">
      <div class="time-info">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Elemento de audio nativo aislado para garantizar soporte robusto en segundo plano -->
    <audio id="audio" preload="auto" playsinline></audio>
    
    <div class="controls">
      <button id="prev" class="ctrl-btn" title="Anterior">⏮</button>
      <button id="play" class="main ctrl-btn" title="Reproducir">▶</button>
      <button id="next" class="ctrl-btn" title="Siguiente">⏭</button>
    </div>

    <div class="sub-controls">
      <div class="volume-box">
        <span id="vol-icon">🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
      </div>
      <button id="clear" class="btn-danger" style="display:none">Vaciar todo</button>
    </div>
  </section>

  <div id="queue-view" class="view-section active">
    <div class="section-header">
      <h2 id="i-queuetitle">Cola de reproducción</h2>
    </div>
    <div id="playlist" class="empty-state">No hay canciones todavía.</div>
  </div>

  <div id="albums-view" class="view-section">
    <div class="section-header">
      <h2 id="i-albumstitle">Tus Álbumes</h2>
    </div>
    <div id="albums-container" class="empty-state">No hay álbumes detectados.</div>
  </div>
</main>

<script>
const translations = {
  es: { sub: "Engine", pick: "＋ Añadir Música", droptext: "Almacenamiento seguro interno", noSong: "Sin reproducción", startMsg: "NERO", queueTab: "Cola", albumsTab: "Álbumes", queueTitle: "Cola de reproducción", albumsTitle: "Tus Álbumes", emptyQueue: "No hay canciones todavía.", emptyAlbums: "No hay álbumes detectados.", clearQueue: "Vaciar todo", playAlbum: "Reproducir", delAlbumBtn: "Borrar", saveBtn: "💾 Backup" },
  pt: { sub: "Engine", pick: "＋ Adicionar Músicas", droptext: "Armazenamento seguro interno", noSong: "Nenhuma música", startMsg: "NERO", queueTab: "Fila", albumsTab: "Álbuns", queueTitle: "Fila de reprodução", albumsTitle: "Seus Álbuns", emptyQueue: "Nenhuma música ainda.", emptyAlbums: "Nenhum álbum detectado.", clearQueue: "Limpar tudo", playAlbum: "Reproduzir", delAlbumBtn: "Apagar", saveBtn: "💾 Backup" },
  en: { sub: "Engine", pick: "＋ Add Music", droptext: "Secure internal storage", noSong: "No track selected", startMsg: "NERO", queueTab: "Queue", albumsTab: "Albums", queueTitle: "Playback queue", albumsTitle: "Your Albums", emptyQueue: "No songs yet.", emptyAlbums: "No albums detected.", clearQueue: "Clear all", playAlbum: "Play", delAlbumBtn: "Delete", saveBtn: "💾 Backup" }
};

let currentLang = localStorage.getItem('nero_lang') || 'es';
const langSelect = document.getElementById('langSelect');
langSelect.value = currentLang;

function updateTexts() {
  const t = translations[currentLang];
  document.getElementById('i-sub').textContent = t.sub;
  document.getElementById('i-pick').textContent = t.pick;
  document.getElementById('i-droptext').textContent = t.droptext;
  document.getElementById('tab-queue').textContent = t.queueTab;
  document.getElementById('tab-albums').textContent = t.albumsTab;
  document.getElementById('i-queuetitle').textContent = t.queueTitle;
  document.getElementById('i-albumstitle').textContent = t.albumsTitle;
  document.getElementById('clear').textContent = t.clearQueue;
  document.getElementById('saveBackup').textContent = t.saveBtn;
  if (current === -1) {
    document.getElementById('title').textContent = t.noSong;
    document.getElementById('artist').textContent = t.startMsg;
  }
  if (tracks.length === 0) {
    document.getElementById('playlist').textContent = t.emptyQueue;
    document.getElementById('albums-container').textContent = t.emptyAlbums;
  }
  renderAlbums();
}

langSelect.addEventListener('change', (e) => {
  currentLang = e.target.value;
  try { localStorage.setItem('nero_lang', currentLang); } catch(err){}
  updateTexts();
});

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
  }
});

const audio = document.getElementById('audio');
const files = document.getElementById('files');
const playlist = document.getElementById('playlist');
const albumsContainer = document.getElementById('albums-container');
const title = document.getElementById('title');
const artist = document.getElementById('artist');
const play = document.getElementById('play');
const progress = document.getElementById('progress');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volume');
const clearBtn = document.getElementById('clear');
const coverImg = document.getElementById('cover-img');
const coverPlaceholder = document.getElementById('cover-placeholder');
const volIcon = document.getElementById('vol-icon');
const saveBackupBtn = document.getElementById('saveBackup');

let tracks = [];
let current = -1;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); }
    const request = indexedDB.open('NeroMusicDB_v6', 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => { db = request.result; resolve(db); };
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('tracks')) {
        database.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
      }
    };
  });
}

function saveTrackToDB(trackObj) {
  return new Promise(async (resolve, reject) => {
    if (!db) await initDB();
    const transaction = db.transaction(['tracks'], 'readwrite');
    const store = transaction.objectStore('tracks');
    const cleanObj = {
      name: trackObj.name,
      artist: trackObj.artist,
      album: trackObj.album,
      coverUrl: trackObj.coverUrl,
      size: trackObj.size,
      blob: trackObj.blob,
      sortOrder: trackObj.sortOrder
    };
    const request = store.add(cleanObj);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function updateAllTracksOrder() {
  if (!db) await initDB();
  const transaction = db.transaction(['tracks'], 'readwrite');
  const store = transaction.objectStore('tracks');
  tracks.forEach((t, index) => {
    t.sortOrder = index;
    store.put({
      id: t.id,
      name: t.name,
      artist: t.artist,
      album: t.album,
      coverUrl: t.coverUrl,
      size: t.size,
      blob: t.blob,
      sortOrder: index
    });
  });
}

function deleteTrackFromDB(id) {
  return new Promise(async (resolve, reject) => {
    if (!db) await initDB();
    const transaction = db.transaction(['tracks'], 'readwrite');
    const store = transaction.objectStore('tracks');
    const request = store.delete(id);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

function clearDB() {
  return new Promise(async (resolve, reject) => {
    if (!db) await initDB();
    const transaction = db.transaction(['tracks'], 'readwrite');
    const store = transaction.objectStore('tracks');
    const request = store.clear();
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

function loadTracksFromDB() {
  return new Promise(async (resolve) => {
    try {
      if (!db) await initDB();
      const transaction = db.transaction(['tracks'], 'readonly');
      const store = transaction.objectStore('tracks');
      const request = store.getAll();
      request.onsuccess = () => {
        let items = request.result;
        items.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
        tracks = items.map(item => ({
          ...item,
          url: URL.createObjectURL(item.blob)
        }));
        if (tracks.length > 0) {
          render();
          if (current === -1) load(0, false);
        }
        resolve();
      };
      request.onerror = () => resolve();
    } catch(e) { resolve(); }
  });
}

saveBackupBtn.onclick = async () => {
  if (tracks.length === 0) {
    alert("No hay canciones guardadas.");
    return;
  }
  const backupData = tracks.map((t, idx) => ({
    name: t.name, artist: t.artist, album: t.album, coverUrl: t.coverUrl, size: t.size, sortOrder: idx
  }));
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "nero_backup.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
};

function updateVolume() {
  const val = parseFloat(volumeSlider.value);
  audio.volume = val;
  volIcon.textContent = val === 0 ? '🔇' : '🔊';
}

volumeSlider.addEventListener('input', updateVolume);

files.addEventListener('change', async e => {
  const uploadedFiles = [...e.target.files];
  for (let file of uploadedFiles) {
    let trackObj = {
      name: file.name.replace(/\.[^/.]+$/, ""),
      artist: "Desconocido",
      album: "Desconocido",
      coverUrl: null,
      size: formatSize(file.size),
      blob: file,
      sortOrder: tracks.length
    };
    
    await new Promise((resolve) => {
      jsmediatags.read(file, {
        onSuccess: function(tag) {
          const tags = tag.tags;
          if (tags.title) trackObj.name = tags.title;
          if (tags.artist) trackObj.artist = tags.artist;
          if (tags.album) trackObj.album = tags.album;
          if (tags.picture) {
            try {
              const data = tags.picture.data;
              let picString = "";
              for (let i = 0; i < data.length; i++) picString += String.fromCharCode(data[i]);
              trackObj.coverUrl = `data:${tags.picture.format};base64,${window.btoa(picString)}`;
            } catch(err) {}
          }
          resolve();
        },
        onError: function() { resolve(); }
      });
    });

    try {
      const insertedId = await saveTrackToDB(trackObj);
      trackObj.id = insertedId;
      trackObj.url = URL.createObjectURL(file);
      tracks.push(trackObj);
      render();
      if (current === -1) load(0);
    } catch(err) {}
  }
  files.value = '';
});

function updateMediaSession(t) {
  title.textContent = t.name;
  artist.textContent = t.artist;
  if (t.coverUrl) {
    coverImg.src = t.coverUrl;
    coverImg.style.display = 'block';
    coverPlaceholder.style.display = 'none';
  } else {
    coverImg.style.display = 'none';
    coverPlaceholder.style.display = 'grid';
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name,
      artist: t.artist,
      album: t.album,
      artwork: t.coverUrl ? [{ src: t.coverUrl, sizes: '512x512', type: 'image/jpeg' }] : []
    });

    navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', () => prev());
    navigator.mediaSession.setActionHandler('nexttrack', () => next());
  }
}

function load(i, autoplay = false) {
  if (!tracks[i]) return;
  current = i;
  const t = tracks[i];
  audio.src = t.url;
  updateMediaSession(t);
  render();
  if (autoplay) {
    audio.play().catch(() => {});
  }
}

function render() {
  const tr = translations[currentLang];
  if (!tracks.length) {
    playlist.className = 'empty-state';
    playlist.textContent = tr.emptyQueue;
    albumsContainer.className = 'empty-state';
    albumsContainer.textContent = tr.emptyAlbums;
    clearBtn.style.display = 'none';
    title.textContent = tr.noSong;
    artist.textContent = tr.startMsg;
    coverImg.style.display = 'none';
    coverPlaceholder.style.display = 'grid';
    return;
  }
  
  playlist.className = 'scroll-list';
  clearBtn.style.display = 'block';
  
  playlist.innerHTML = tracks.map((t, i) => `
    <div class="track-item ${i === current ? 'active' : ''}" data-i="${i}">
      <div class="track-num">${i + 1}</div>
      <div class="track-details">
        <b>${escapeHtml(t.name)}</b>
        <span>${escapeHtml(t.artist)} • ${t.size}</span>
      </div>
      <div class="track-actions-item">
        <button class="mini-btn" data-action="up" data-index="${i}">▲</button>
        <button class="mini-btn" data-action="down" data-index="${i}">▼</button>
        <button class="mini-btn del" data-del="${i}">✕</button>
      </div>
    </div>`).join('');

  playlist.querySelectorAll('.track-item').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('button')) return;
      load(+el.dataset.i, true);
    };
  });

  playlist.querySelectorAll('.mini-btn[data-action]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      moveTrack(+btn.dataset.index, btn.dataset.action);
    };
  });

  playlist.querySelectorAll('.mini-btn.del').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      removeTrack(+btn.dataset.del);
    };
  });

  renderAlbums();
}

async function moveTrack(index, direction) {
  const targetIndex = direction === 'up' ? index - 1 : index + 1;
  if (targetIndex < 0 || targetIndex >= tracks.length) return;
  const item = tracks.splice(index, 1)[0];
  tracks.splice(targetIndex, 0, item);
  if (current === index) current = targetIndex;
  else if (current === targetIndex) current = index;
  
  await updateAllTracksOrder();
  render();
}

function renderAlbums() {
  const tr = translations[currentLang];
  const albumsMap = {};
  tracks.forEach((t, index) => {
    const albName = t.album || "Desconocido";
    if (!albumsMap[albName]) {
      albumsMap[albName] = { name: albName, artist: t.artist, coverUrl: t.coverUrl, tracks: [] };
    }
    albumsMap[albName].tracks.push(index);
    if (!albumsMap[albName].coverUrl && t.coverUrl) albumsMap[albName].coverUrl = t.coverUrl;
  });

  const albumsList = Object.values(albumsMap);
  if (!albumsList.length) {
    albumsContainer.className = 'empty-state';
    albumsContainer.textContent = tr.emptyAlbums;
    return;
  }

  albumsContainer.className = 'albums-grid';
  albumsContainer.innerHTML = albumsList.map((album) => `
    <div class="album-card">
      <div>
        <div class="album-cover" data-first="${album.tracks[0]}">
          ${album.coverUrl ? `<img src="${album.coverUrl}" alt="Album">` : '♫'}
        </div>
        <div class="album-title">${escapeHtml(album.name)}</div>
        <div class="album-artist">${escapeHtml(album.artist)}</div>
      </div>
      <div class="album-btns">
        <button class="album-btn-play" data-tracks='${JSON.stringify(album.tracks)}'>${tr.playAlbum}</button>
        <button class="album-btn-del" data-albumname="${escapeHtml(album.name)}">${tr.delAlbumBtn}</button>
      </div>
    </div>
  `).join('');

  albumsContainer.querySelectorAll('.album-cover').forEach(cov => {
    cov.onclick = () => {
      load(+cov.dataset.first, true);
      document.querySelector('[data-target="queue-view"]').click();
    };
  });

  albumsContainer.querySelectorAll('.album-btn-play').forEach(btn => {
    btn.onclick = () => {
      const albumTracks = JSON.parse(btn.dataset.tracks);
      if (albumTracks.length > 0) {
        load(albumTracks[0], true);
        document.querySelector('[data-target="queue-view"]').click();
      }
    };
  });

  albumsContainer.querySelectorAll('.album-btn-del').forEach(btn => {
    btn.onclick = () => removeAlbum(btn.dataset.albumname);
  });
}

async function removeTrack(i) {
  const t = tracks[i];
  if (t && t.id) await deleteTrackFromDB(t.id);
  tracks.splice(i, 1);
  if (current === i) {
    audio.pause();
    current = -1;
    if (tracks.length > 0) load(Math.min(i, tracks.length - 1), false);
    else audio.src = '';
  } else if (current > i) { current--; }
  await updateAllTracksOrder();
  render();
}

async function removeAlbum(albumName) {
  const tracksToRemove = tracks.filter(t => (t.album || "Desconocido") === albumName);
  for (let t of tracksToRemove) {
    if (t.id) await deleteTrackFromDB(t.id);
  }
  tracks = tracks.filter(t => (t.album || "Desconocido") !== albumName);
  audio.pause();
  current = -1;
  audio.src = '';
  await updateAllTracksOrder();
  render();
  if (tracks.length > 0) load(0, false);
}

clearBtn.onclick = async () => {
  audio.pause();
  audio.src = '';
  tracks = [];
  current = -1;
  await clearDB();
  render();
};

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}
function formatSize(n) { return (n / (1024 * 1024)).toFixed(1) + ' MB'; }
function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

play.onclick = () => {
  if (current < 0) { if (tracks.length > 0) load(0, true); return; }
  audio.paused ? audio.play() : audio.pause();
};

audio.onplay = () => {
  play.textContent = '⏸';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
};
audio.onpause = () => {
  play.textContent = '▶';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
};
audio.onended = () => next();

function next() { if (tracks.length) load((current + 1) % tracks.length, true); }
function prev() { if (tracks.length) load((current - 1 + tracks.length) % tracks.length, true); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;

audio.ontimeupdate = () => {
  if (!isNaN(audio.duration)) {
    progress.value = (audio.currentTime / audio.duration) * 100;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    durationEl.textContent = formatTime(audio.duration);
    
    if ('mediaSession' in navigator && typeof navigator.mediaSession.setPositionState === 'function') {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate,
          position: audio.currentTime
        });
      } catch (err) {}
    }
  }
};

progress.oninput = () => {
  if (!isNaN(audio.duration)) audio.currentTime = (progress.value / 100) * audio.duration;
};

initDB().then(() => loadTracksFromDB());
updateVolume();
updateTexts();
</script>
</body>
</html>
